<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>句子拼写练习 - 丝网盒子</title>
<link rel="stylesheet" href="shared.css?v=20261013l">

<style>
:root{
  --warm-bg:#f6f1e6; --warm-card:#fffdf8; --warm-line:#e7ddc4; --warm-ink:#3a3323;
  --warm-soft:#8a7d63; --warm-main:#b07d2b; --warm-main-deep:#8a5f1d;
  --warm-tint:#fbf3df; --warm-ok:#2f7d4f; --warm-ok-bg:#e9f4ec; --warm-ok-line:#bfe0cb;
  --warm-bad:#c0392b; --warm-bad-bg:#fdeeea; --warm-bad-line:#f0c4bb;
}
body{background:var(--warm-bg)}
.ss2-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.ss2-progress{flex:1;min-width:160px;height:9px;background:#e9e1cb;border-radius:99px;overflow:hidden}
.ss2-progress>span{display:block;height:100%;background:var(--warm-main);border-radius:99px;transition:width .3s}
.ss2-count{font-size:14px;font-weight:700;color:var(--warm-ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.ss2-rate{font-size:13px;color:var(--warm-soft);white-space:nowrap}
.ss2-exit{font-size:13px;color:var(--warm-soft);text-decoration:none;white-space:nowrap}
.ss2-exit:hover{color:var(--warm-main-deep)}
.ss2-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.ss2-tab{border:1.5px solid var(--warm-line);background:var(--warm-card);color:var(--warm-soft);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.ss2-tab:hover{border-color:var(--warm-main);color:var(--warm-main-deep)}
.ss2-tab.on{background:var(--warm-main);border-color:var(--warm-main);color:#fff}

/* 顶部单词预习卡 */
.ss2-cards{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.ss2-wcard{min-width:96px;background:var(--warm-card);border:1.5px solid var(--warm-line);border-radius:12px;padding:9px 14px;text-align:center;transition:all .2s;box-shadow:0 1px 3px rgba(90,70,30,.06)}
.ss2-wcard .lb{display:inline-block;font-size:11px;font-weight:700;color:var(--warm-main-deep);background:var(--warm-tint);border:1px solid #ecd9a8;border-radius:999px;padding:1px 9px;margin-bottom:5px}
.ss2-wcard .wd{font-size:17px;font-weight:800;color:var(--warm-ink);word-break:break-all}
.ss2-wcard .ph{font-size:11.5px;color:var(--warm-soft);margin-top:2px;min-height:14px}
.ss2-wcard.cur{border-color:var(--warm-main);box-shadow:0 0 0 3px rgba(176,125,43,.14);transform:translateY(-2px)}
.ss2-wcard.ok{border-color:var(--warm-ok-line);background:var(--warm-ok-bg)}
.ss2-wcard.ok .wd{color:var(--warm-ok);text-decoration:line-through}
.ss2-wcard.bad{border-color:var(--warm-bad-line);background:var(--warm-bad-bg)}
.ss2-wcard.bad .wd{color:var(--warm-bad);text-decoration:line-through}
.ss2-wcard.auto{opacity:.55;border-style:dashed}
.ss2-wcard.auto .wd{text-decoration:none;color:var(--warm-soft)}
.ss2-cards.hide{display:none}

/* 信息条 */
.ss2-note{max-width:560px;margin:0 auto 18px;background:var(--warm-tint);border:1px solid #ecd9a8;border-radius:10px;padding:9px 14px;font-size:13px;color:#7a5c1c;display:flex;align-items:center;gap:9px}
.ss2-note b{font-weight:800}

/* 主卡 */
.ss2-card{background:var(--warm-card);border:1px solid var(--warm-line);border-radius:18px;box-shadow:0 2px 6px rgba(90,70,30,.06),0 14px 34px rgba(90,70,30,.08);padding:38px 30px 30px;text-align:center;max-width:680px;margin:0 auto}
.ss2-unit{font-size:12.5px;font-weight:700;color:var(--warm-main-deep);background:var(--warm-tint);border:1px solid #ecd9a8;border-radius:999px;padding:3px 13px;display:inline-block;margin-bottom:16px}
.ss2-zh{font-size:29px;font-weight:800;color:var(--warm-ink);line-height:1.55;letter-spacing:.5px}
.ss2-dots{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:26px 0 10px;min-height:10px}
.ss2-dot{width:34px;height:6px;border-radius:99px;background:#e5dcc4;transition:all .25s}
.ss2-dot.cur{background:var(--warm-main)}
.ss2-dot.ok{background:var(--warm-ok)}
.ss2-dot.bad{background:var(--warm-bad)}
.ss2-hintline{font-size:13px;color:var(--warm-soft);margin-top:8px}

/* 输入区 */
.ss2-inputrow{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:24px;flex-wrap:wrap}
.ss2-input{width:min(360px,80vw);border:2px solid var(--warm-line);border-radius:12px;background:#fff;padding:12px 16px;font-size:21px;font-weight:700;color:var(--warm-ink);text-align:center;font-family:inherit;outline:none;transition:border-color .15s, box-shadow .15s}
.ss2-input:focus{border-color:var(--warm-main);box-shadow:0 0 0 4px rgba(176,125,43,.13)}
.ss2-input.err{border-color:var(--warm-bad);box-shadow:0 0 0 4px rgba(192,57,43,.12);animation:ss2-shake .35s}
.ss2-input.good{border-color:var(--warm-ok)}
@keyframes ss2-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(6px)}50%{transform:translateX(-6px)}75%{transform:translateX(4px)}}
.ss2-send{border:none;background:var(--warm-main);color:#fff;border-radius:12px;padding:13px 22px;font-size:15.5px;font-weight:800;cursor:pointer;font-family:inherit;transition:background .15s;white-space:nowrap}
.ss2-send:hover{background:var(--warm-main-deep)}
.ss2-send:disabled{opacity:.45;cursor:not-allowed}

/* 底部工具栏 */
.ss2-tools{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:26px}
.ss2-tool{border:1.5px solid var(--warm-line);background:var(--warm-card);color:var(--warm-soft);border-radius:10px;padding:8px 14px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.ss2-tool:hover{border-color:var(--warm-main);color:var(--warm-main-deep)}
.ss2-tool kbd{font-family:inherit;font-size:11px;background:#f0e9d6;border:1px solid #ddd2b6;border-radius:5px;padding:1px 6px;color:var(--warm-soft)}
.ss2-tool.on{background:var(--warm-main);border-color:var(--warm-main);color:#fff}
.ss2-tool.on kbd{background:rgba(255,255,255,.22);border-color:transparent;color:#fff}

/* 反馈区 */
.ss2-feedback{margin-top:22px;border-radius:12px;padding:15px 18px;text-align:left;font-size:15px;line-height:1.8;display:none}
.ss2-feedback.show{display:block}
.ss2-feedback.good{background:var(--warm-ok-bg);border:1px solid var(--warm-ok-line);color:#1d5c39}
.ss2-feedback.bad{background:var(--warm-bad-bg);border:1px solid var(--warm-bad-line);color:#8c2b1f}
.ss2-feedback b{font-weight:800}
.ss2-feedback .ex{display:block;margin-top:6px;font-size:14px;opacity:.85}

/* 完成页 */
.ss2-done{text-align:center;max-width:560px;margin:0 auto;background:var(--warm-card);border:1px solid var(--warm-line);border-radius:18px;padding:42px 30px;box-shadow:0 2px 6px rgba(90,70,30,.06),0 14px 34px rgba(90,70,30,.08);animation:ss2-pop .3s}
.ss2-done h2{font-size:25px;font-weight:800;color:var(--warm-ink);margin-bottom:8px}
.ss2-done .sum{font-size:15px;color:var(--warm-soft);line-height:2;margin:14px 0 22px}
.ss2-done .sum b{color:var(--warm-main-deep);font-variant-numeric:tabular-nums}
.ss2-wronglist{text-align:left;background:var(--warm-bad-bg);border:1px solid var(--warm-bad-line);border-radius:10px;padding:14px 16px;margin-bottom:22px;font-size:14px;line-height:2;color:#8c2b1f;max-height:220px;overflow:auto}
@keyframes ss2-pop{0%{transform:scale(.94);opacity:0}100%{transform:scale(1);opacity:1}}
.ss2-tip{font-size:12.5px;color:var(--warm-soft);margin-top:26px;text-align:center;line-height:1.9}
@media(max-width:640px){
  .ss2-card{padding:28px 14px 22px}
  .ss2-zh{font-size:22px}
  .ss2-wcard{min-width:78px;padding:7px 10px}
  .ss2-wcard .wd{font-size:15px}
  .ss2-dot{width:26px}
  .ss2-input{font-size:18px}
}
</style>

<body>



<main class="page-wrap">
  <h1>句子拼写练习</h1>
  <p class="page-desc">看中文，把整句英文打出来。直接键盘输入，打完一个词按空格进下一个，全句完成按 Enter。每个词当场判定，拼错的句子自动收进错句列表。</p>

  <div id="ss2Pick">
    <div class="ss2-tabs" id="ss2Tabs"></div>
  </div>

  <div id="ss2Play" hidden>
    <div class="ss2-top">
      <div class="ss2-progress"><span id="ss2Bar" style="width:0%"></span></div>
      <span class="ss2-count" id="ss2Count"></span>
      <span class="ss2-rate" id="ss2Rate"></span>
      <a class="ss2-exit" href="index.html">退出 →</a>
    </div>

    <div class="ss2-cards" id="ss2Cards"></div>

    <div class="ss2-note" id="ss2Note"></div>

    <div class="ss2-card">
      <span class="ss2-unit" id="ss2Unit"></span>
      <div class="ss2-zh" id="ss2Zh"></div>
      <div class="ss2-dots" id="ss2Dots"></div>
      <div class="ss2-hintline">直接键盘输入英文，空格进入下一个单词</div>
      <div class="ss2-inputrow">
        <input class="ss2-input" id="ss2Input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="在这里输入…">
        <button class="ss2-send" id="ss2Send" type="button">提交 ⏎</button>
      </div>
      <div class="ss2-feedback" id="ss2Fb" role="status"></div>
    </div>

    <div class="ss2-tools">
      <button class="ss2-tool" id="ss2Speak" type="button">🔊 播放发音</button>
      <button class="ss2-tool" id="ss2Redo" type="button">↺ 重来本句</button>
      <button class="ss2-tool on" id="ss2CardsToggle" type="button">👁 注释 <kbd>J</kbd></button>
    </div>
  </div>

  <div id="ss2Done" hidden>
    <div class="ss2-done">
      <h2 id="ss2DoneTitle">这一组练完了</h2>
      <div class="sum" id="ss2DoneSum"></div>
      <div class="ss2-wronglist" id="ss2WrongList" hidden></div>
      <div class="ss2-tools" style="justify-content:center">
        <button class="ss2-send" id="ss2AgainWrong" type="button" hidden style="padding:11px 20px">重练错句</button>
        <button class="ss2-send" id="ss2AgainAll" type="button" style="padding:11px 20px">打乱再来一组</button>
        <a class="ss2-tool" href="index.html">回课程中心</a>
      </div>
    </div>
  </div>

  <p class="ss2-tip">句子课程：档口一百句 · WhatsApp 一百句 · 30 天句子实战 · 30 天成交话术<br>纯数字和符号（如 304、—）自动跳过不用拼；记录保存在桌面本机数据文件中，可随完整备份保存</p>
</main>



<script src="desktop.js"></script>

</body>
</html>
