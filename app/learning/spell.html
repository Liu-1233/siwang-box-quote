<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>单词拼写练习 - 丝网盒子</title>
<link rel="stylesheet" href="shared.css?v=20261013l">

<style>
:root{
  --warm-bg:#f6f1e6; --warm-card:#fffdf8; --warm-line:#e7ddc4; --warm-ink:#3a3323;
  --warm-soft:#8a7d63; --warm-main:#b07d2b; --warm-main-deep:#8a5f1d;
  --warm-tint:#fbf3df; --warm-ok:#2f7d4f; --warm-ok-bg:#e9f4ec; --warm-ok-line:#bfe0cb;
  --warm-bad:#c0392b; --warm-bad-bg:#fdeeea; --warm-bad-line:#f0c4bb;
}
body{background:var(--warm-bg)}
.sp-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.sp-progress{flex:1;min-width:160px;height:9px;background:#e9e1cb;border-radius:99px;overflow:hidden}
.sp-progress>span{display:block;height:100%;background:var(--warm-main);border-radius:99px;transition:width .3s}
.sp-count{font-size:14px;font-weight:700;color:var(--warm-ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.sp-rate{font-size:13px;color:var(--warm-soft);white-space:nowrap}
.sp-exit{font-size:13px;color:var(--warm-soft);text-decoration:none;white-space:nowrap}
.sp-exit:hover{color:var(--warm-main-deep)}

.sp-note{max-width:560px;margin:0 auto 18px;background:var(--warm-tint);border:1px solid #ecd9a8;border-radius:10px;padding:9px 14px;font-size:13px;color:#7a5c1c;display:flex;align-items:center;gap:9px}
.sp-note b{font-weight:800}

.sp-card{background:var(--warm-card);border:1px solid var(--warm-line);border-radius:18px;box-shadow:0 2px 6px rgba(90,70,30,.06),0 14px 34px rgba(90,70,30,.08);padding:40px 30px 30px;text-align:center;max-width:640px;margin:0 auto}
.sp-unit{font-size:12.5px;font-weight:700;color:var(--warm-main-deep);background:var(--warm-tint);border:1px solid #ecd9a8;border-radius:999px;padding:3px 13px;display:inline-block;margin-bottom:16px}
.sp-zh{font-size:30px;font-weight:800;color:var(--warm-ink);line-height:1.5}
.sp-pos{font-size:14px;color:var(--warm-soft);margin-top:8px}
.sp-ph{font-size:16px;color:var(--warm-ink);margin-top:12px;min-height:24px;font-family:Georgia,serif}
.sp-ph.hidden{visibility:hidden}
.sp-hintline{font-size:13px;color:var(--warm-soft);margin-top:22px}

.sp-inputrow{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.sp-input{width:min(360px,80vw);border:2px solid var(--warm-line);border-radius:12px;background:#fff;padding:12px 16px;font-size:21px;font-weight:700;color:var(--warm-ink);text-align:center;font-family:inherit;outline:none;transition:border-color .15s, box-shadow .15s}
.sp-input:focus{border-color:var(--warm-main);box-shadow:0 0 0 4px rgba(176,125,43,.13)}
.sp-input.err{border-color:var(--warm-bad);box-shadow:0 0 0 4px rgba(192,57,43,.12);animation:sp-shake .35s}
.sp-input.good{border-color:var(--warm-ok)}
@keyframes sp-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(6px)}50%{transform:translateX(-6px)}75%{transform:translateX(4px)}}
.sp-send{border:none;background:var(--warm-main);color:#fff;border-radius:12px;padding:13px 22px;font-size:15.5px;font-weight:800;cursor:pointer;font-family:inherit;transition:background .15s;white-space:nowrap}
.sp-send:hover{background:var(--warm-main-deep)}
.sp-send:disabled{opacity:.45;cursor:not-allowed}

.sp-tools{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:26px}
.sp-tool{border:1.5px solid var(--warm-line);background:var(--warm-card);color:var(--warm-soft);border-radius:10px;padding:8px 14px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.sp-tool:hover{border-color:var(--warm-main);color:var(--warm-main-deep)}
.sp-tool kbd{font-family:inherit;font-size:11px;background:#f0e9d6;border:1px solid #ddd2b6;border-radius:5px;padding:1px 6px;color:var(--warm-soft)}
.sp-tool.on{background:var(--warm-main);border-color:var(--warm-main);color:#fff}
.sp-tool.on kbd{background:rgba(255,255,255,.22);border-color:transparent;color:#fff}

.sp-feedback{margin-top:22px;border-radius:12px;padding:15px 18px;text-align:left;font-size:15px;line-height:1.8;display:none}
.sp-feedback.show{display:block}
.sp-feedback.good{background:var(--warm-ok-bg);border:1px solid var(--warm-ok-line);color:#1d5c39}
.sp-feedback.bad{background:var(--warm-bad-bg);border:1px solid var(--warm-bad-line);color:#8c2b1f}
.sp-feedback b{font-weight:800}
.sp-feedback .ex{display:block;margin-top:6px;font-size:14px;opacity:.85}

.sp-done{text-align:center;max-width:560px;margin:0 auto;background:var(--warm-card);border:1px solid var(--warm-line);border-radius:18px;padding:42px 30px;box-shadow:0 2px 6px rgba(90,70,30,.06),0 14px 34px rgba(90,70,30,.08);animation:sp-pop .3s}
.sp-done h2{font-size:25px;font-weight:800;color:var(--warm-ink);margin-bottom:8px}
.sp-done .sum{font-size:15px;color:var(--warm-soft);line-height:2;margin:14px 0 22px}
.sp-done .sum b{color:var(--warm-main-deep);font-variant-numeric:tabular-nums}
.sp-wronglist{text-align:left;background:var(--warm-bad-bg);border:1px solid var(--warm-bad-line);border-radius:10px;padding:14px 16px;margin-bottom:22px;font-size:14px;line-height:2;color:#8c2b1f;max-height:220px;overflow:auto}
@keyframes sp-pop{0%{transform:scale(.94);opacity:0}100%{transform:scale(1);opacity:1}}
.sp-tip{font-size:12.5px;color:var(--warm-soft);margin-top:26px;text-align:center;line-height:1.9}
@media(max-width:640px){
  .sp-card{padding:28px 14px 22px}
  .sp-zh{font-size:23px}
  .sp-input{font-size:18px}
}
</style>
<link rel="stylesheet" href="desktop.css"></head>
<body>



<main class="page-wrap">
  <h1>单词拼写练习</h1>
  <p class="page-desc">看中文释义，把英文打出来，按 Enter 提交。42 个丝网规格高频词，拼错自动进错词本，练完可以重练错词。</p>

  <div id="spPlay">
    <div class="sp-top">
      <div class="sp-progress"><span id="spBar" style="width:0%"></span></div>
      <span class="sp-count" id="spCount">0 / 0</span>
      <span class="sp-rate" id="spRate"></span>
      <a class="sp-exit" href="index.html">退出 →</a>
    </div>

    <div class="sp-note" id="spNote"></div>

    <div class="sp-card" id="spCard">
      <div class="sp-zh" id="spZh"></div>
      <div class="sp-pos" id="spPos"></div>
      <div class="sp-ph hidden" id="spPh"></div>
      <div class="sp-hintline">直接键盘输入英文，按 Enter 提交</div>
      <div class="sp-inputrow">
        <input class="sp-input" id="spInput" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="在这里输入…">
        <button class="sp-send" id="spSend" type="button">提交 ⏎</button>
      </div>
      <div class="sp-feedback" id="spFb" role="status"></div>
    </div>

    <div class="sp-tools">
      <button class="sp-tool" id="spSpeak" type="button">🔊 播放发音</button>
      <button class="sp-tool" id="spHint" type="button">💡 提示一下</button>
      <button class="sp-tool" id="spSkip" type="button">👀 不会，看答案</button>
    </div>
  </div>

  <div id="spDone" hidden>
    <div class="sp-done">
      <h2 id="spDoneTitle">这一轮练完了</h2>
      <div class="sum" id="spDoneSum"></div>
      <div class="sp-wronglist" id="spWrongList" hidden></div>
      <div class="sp-tools" style="justify-content:center">
        <button class="sp-send" id="spAgainWrong" type="button" hidden style="padding:11px 20px">重练错词</button>
        <button class="sp-send" id="spAgainAll" type="button" style="padding:11px 20px">打乱再来一轮</button>
        <a class="sp-tool" href="index.html">回课程中心</a>
      </div>
    </div>
  </div>

  <p class="sp-tip">已掌握 <b id="spMastered">0</b> / <b id="spTotal">0</b> 词 · 拼对一次即算掌握，拼错会移出<br>记录保存在桌面本机数据文件中，可随完整备份保存</p>
</main>



<script src="desktop.js"></script>
<script src="assets/data.js?v=20261026a"></script>
<script src="assets/custom-words.js?v=20261026a"></script>
<script src="assets/spell.js?v=20261013l"></script>

</body>
</html>
