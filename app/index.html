<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 内容安全策略：只允许加载本地脚本/样式，联网仅放行汇率接口。
     不加这一条 Electron 每次启动都会警告页面不受限制。 -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' 'unsafe-inline';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data:;
  font-src 'self' data:;
  frame-src 'self';
  connect-src https://open.er-api.com;
  form-action 'none';
  base-uri 'none';
  object-src 'none'">
<title>丝网盒子</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">丝</div>
      <div class="brand-text">
        <b>丝网盒子</b>
        <small id="app-ver">桌面版</small>
      </div>
    </div>

    <nav class="nav" id="nav">
      <a class="nav-item" data-page="dashboard">
        <svg viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1"/><rect x="9" y="9" width="5.5" height="5.5" rx="1"/></svg>
        <span>工作台</span>
      </a>
      <a class="nav-item" data-page="customers">
        <svg viewBox="0 0 16 16"><circle cx="8" cy="5.2" r="2.7"/><path d="M2.6 14c0-2.6 2.4-4.3 5.4-4.3s5.4 1.7 5.4 4.3"/></svg>
        <span>客户管理</span>
      </a>
      <a class="nav-item" data-page="products">
        <svg viewBox="0 0 16 16"><path d="M8 1.6l6 3v6.8l-6 3-6-3V4.6z"/><path d="M2 4.6l6 3 6-3M8 7.6V14.4"/></svg>
        <span>产品资料</span>
      </a>
      <a class="nav-item" data-page="docs">
        <svg viewBox="0 0 16 16"><path d="M3.5 1.6h6l3 3v9.8h-9z"/><path d="M9.3 1.6v3.2h3.2M5.6 8h5M5.6 11h5"/></svg>
        <span>单据中心</span>
      </a>
      <a class="nav-item" data-page="tools">
        <svg viewBox="0 0 16 16"><path d="M10.4 2.2a3.6 3.6 0 0 0-3.2 5.1l-5 5 1.5 1.5 5-5a3.6 3.6 0 0 0 5.1-3.2l-2 2-2-2z"/></svg>
        <span>计算工具</span>
      </a>
      <a class="nav-item" data-page="industryTools">
        <svg viewBox="0 0 16 16"><path d="M2 3.2h12v9.6H2z"/><path d="M4.4 5.5h2.2v2.2H4.4zM9.4 5.5h2.2v2.2H9.4zM4.4 9.2h2.2v2.2H4.4zM9.4 9.2h2.2v2.2H9.4z"/></svg>
        <span>行业工具</span>
      </a>
      <a class="nav-item" data-page="loadPlanner">
        <svg viewBox="0 0 16 16"><path d="M2 4.2 8 1.5l6 2.7v7.6L8 14.5l-6-2.7z"/><path d="M2 4.2 8 7l6-2.8M8 7v7.5"/></svg>
        <span>装柜预排</span>
      </a>
      <a class="nav-item" data-page="standards">
        <svg viewBox="0 0 16 16"><path d="M3.5 1.6h9v12.8h-9z"/><path d="M5.6 4.6h4.8M5.6 7.6h4.8M5.6 10.6h3.2"/></svg>
        <span>标准速查</span>
      </a>
      <a class="nav-item" data-page="english">
        <svg viewBox="0 0 16 16"><path d="M2.4 2.4h11.2v11.2H2.4z"/><path d="M5.2 11l2.8-7 2.8 7M6.2 8.8h3.6"/></svg>
        <span>学习中心</span>
      </a>
    </nav>

    <div class="nav-divider"></div>

    <nav class="nav">
      <a class="nav-item" data-page="license" title="AI 卡密">
        <svg viewBox="0 0 16 16"><circle cx="5.2" cy="10.8" r="2.6"/><path d="M7 9 13.4 2.6M11.4 4.6l1.6 1.6M9.8 6.2l1.6 1.6"/></svg>
        <span>AI 卡密</span>
      </a>
      <a class="nav-item" data-page="settings">
        <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.3"/><path d="M8 1.4v1.8M8 12.8v1.8M14.6 8h-1.8M3.2 8H1.4M12.7 3.3l-1.3 1.3M4.6 11.4l-1.3 1.3M12.7 12.7l-1.3-1.3M4.6 4.6L3.3 3.3"/></svg>
        <span>设置</span>
      </a>
    </nav>

    <div class="sidebar-foot">
      <div class="foot-line">数据保存在本机</div>
      <div class="foot-line">业务数据不上传</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1 id="pageTitle">工作台</h1>
      <div class="topbar-right">
        <span class="clock" id="clock">--:--</span>
        <span class="dot"></span>
        <span class="store-note">本地数据</span>
      </div>
    </header>
    <section class="market-strip" aria-label="世界时间与参考汇率">
      <div class="market-label">GLOBAL DESK</div>
      <div class="market-time"><span>上海</span><b data-world-zone="Asia/Shanghai">--:--</b></div>
      <div class="market-time"><span>迪拜</span><b data-world-zone="Asia/Dubai">--:--</b></div>
      <div class="market-time"><span>伦敦</span><b data-world-zone="Europe/London">--:--</b></div>
      <div class="market-time"><span>纽约</span><b data-world-zone="America/New_York">--:--</b></div>
      <div class="market-sep"></div>
      <div class="market-rate" id="topFx"><span>参考汇率</span><b>正在获取…</b></div>
      <button class="market-refresh" title="刷新参考汇率" onclick="loadTopFx(true)">↻</button>
    </section>
    <div class="content" id="content"></div>
  </main>

</div>

<div id="printView"></div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-head"><b id="modalTitle">新建</b><button class="icon-btn" onclick="UI.closeModal()">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<script src="model.js"></script>
<script src="product-specs.js"></script>
<script src="store.js"></script>
<!-- 受控纸面：主进程 require 同一份，页面这里同引，保证预览与 B3 导出是同一套模板 -->
<script src="reference-sheets.js"></script>
<script src="sheet-rc.js"></script>
<script src="sheet.js"></script>
<script src="wire-quote-rules.js"></script>
<!-- P1-D-05：原版 RunCheng 真实场景实物图只读资源（须在 pages.js 之前装载） -->
<script src="real-images.js"></script>
<script src="pages.js"></script>
<script src="product-intake.js"></script>
<script src="feature-windows.js"></script>
<script src="product-import.js"></script>
<script src="reference-editor.js"></script>
<script src="load-playback.js"></script>
<script type="module" src="load-planner-3d.js"></script>
<script src="learning/assets/data.js"></script>
<script src="learning-panel.js"></script>
<script src="app.js"></script>
</body>
</html>
